stages:
  - build

release:
  only:
    refs:
      - master
  
  stage: build
  
  image: golang:alpine

  script:
    - export CI=true
    - export VERSION=$CI_PIPELINE_IID
    - apk add --no-cache bash build-base
    - go test -race ./...
    - go vet ./...
    - ./scripts/e2e.sh
    - ./scripts/bins.sh

  artifacts:
    paths:
      - scnnr_bins.zip
      - scnnr_bins.zip.sha256
      - LICENSE
      - README.md
